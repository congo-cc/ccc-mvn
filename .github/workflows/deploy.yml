name: Release to Maven Central

# Publishes the released modules to Maven Central whenever a GitHub release
# is published. Anyone who can create a release in this repository can
# release; no personal credentials are involved. The credentials come from
# the secrets listed below (preferably organization secrets) and the
# `maven-central` environment, which can be protected with required reviewers.
#
# The version is taken from the release tag (`v2.2.0` or `2.2.0`), so the
# `revision` property in pom.xml does not need to be bumped before releasing.
#
# Required secrets (see RELEASING.md):
#   MAVEN_CENTRAL_USERNAME  Central Portal user-token name
#   MAVEN_CENTRAL_TOKEN     Central Portal user-token password
#   GPG_PRIVATE_KEY         ASCII-armored private key of the project signing key
#   GPG_PASSPHRASE          passphrase of that key

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing GitHub release to (re)publish, e.g. v2.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/namespace/org.congocc
    permissions:
      contents: write # attach the built jars to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Derive version from release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v2.2.0, 2.2.0 or v2.2.0-RC1"
            exit 1
          fi
          case "$VERSION" in
            *SNAPSHOT*) echo "::error::SNAPSHOT versions cannot be released to Maven Central"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      # Runs before setup-java on purpose: this action writes its own
      # settings.xml, which must not overwrite the one setup-java creates
      # with the Central credentials.
      - name: Set up Maven
        uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
        with:
          maven-version: 3.9.16

      - name: Set up JDK 17 and Maven Central credentials
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          overwrite-settings: true
          server-id: central # must match <publishingServerId> in pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check that settings.xml holds the Central credentials
        run: grep -q '<id>central</id>' ~/.m2/settings.xml || { echo "::error::no 'central' server in ~/.m2/settings.xml"; exit 1; }

      - name: Build and test
        run: mvn -B -ntp verify -Drevision="${{ steps.version.outputs.version }}"

      - name: Sign and publish to Maven Central
        run: mvn -B -ntp -Prelease deploy -DskipTests -Drevision="${{ steps.version.outputs.version }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Attach jars to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$TAG" --clobber \
            org.congocc.parser.generator/target/org.congocc.parser.generator-"$VERSION"*.jar \
            org.congocc.maven.plugin/target/org.congocc.maven.plugin-"$VERSION"*.jar
